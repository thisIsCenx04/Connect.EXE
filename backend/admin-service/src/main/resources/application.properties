spring.application.name=admin-service

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${ADMIN_DB_NAME:admin_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
logging.level.org.flywaydb=DEBUG

server.port=${ADMIN_SERVER_PORT:8088}

app.jwt.issuer=connectexe
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}

# Auth service URL for inter-service communication
app.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

logging.level.root=INFO
logging.level.org.springframework.security=INFO
