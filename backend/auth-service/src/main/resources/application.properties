spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Connect.EXE}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:dtpo9094}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.defer-datasource-initialization=true
spring.flyway.baseline-version=0
logging.level.org.flywaydb=DEBUG


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

server.port=${SERVER_PORT:8081}

app.jwt.issuer=connectexe
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}
app.jwt.access-token-ttl-minutes=30
app.jwt.refresh-token-ttl-days=7
app.auth.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.auth.verification-token-ttl-minutes=1440
app.auth.reset-token-ttl-minutes=30

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@connectexe.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

logging.level.root=INFO
logging.level.org.springframework.security=INFO
