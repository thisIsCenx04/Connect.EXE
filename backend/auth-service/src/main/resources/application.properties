spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Connect.EXE}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:dtpo9094}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000

server.port=${SERVER_PORT:8081}

app.jwt.issuer=connectexe
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}
app.jwt.access-token-ttl-minutes=30
app.jwt.refresh-token-ttl-days=7

logging.level.root=INFO
logging.level.org.springframework.security=INFO
