spring.application.name=payment-service

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${PAYMENT_SERVER_PORT:8087}

app.jwt.issuer=connectexe
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}

payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.pay-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8087/api/billing/vnpay/return}
payment.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8087/api/billing/vnpay/ipn}
payment.vnpay.locale=${VNPAY_LOCALE:vn}

payment.momo.partner-code=${MOMO_PARTNER_CODE:}
payment.momo.access-key=${MOMO_ACCESS_KEY:}
payment.momo.secret-key=${MOMO_SECRET_KEY:}
payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
payment.momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8087/api/billing/momo/return}
payment.momo.ipn-url=${MOMO_IPN_URL:http://localhost:8087/api/billing/momo/ipn}
payment.momo.request-type=${MOMO_REQUEST_TYPE:onDelivery}
payment.momo.lang=${MOMO_LANG:vi}

logging.level.root=INFO
logging.level.org.springframework.security=INFO
