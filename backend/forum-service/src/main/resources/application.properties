spring.application.name=forum-service

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${FORUM_DB_NAME:forum_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
logging.level.org.flywaydb=DEBUG

server.port=${FORUM_SERVER_PORT}

app.jwt.issuer=connectexe
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}

logging.level.root=INFO
logging.level.org.springframework.security=INFO
