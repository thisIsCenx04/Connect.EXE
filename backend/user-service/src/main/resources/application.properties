spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${USER_DB_NAME:user_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
logging.level.org.flywaydb=DEBUG

server.port=${USER_SERVER_PORT:8084}

app.jwt.issuer=connectexe
app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:connectexe}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.root=INFO
logging.level.org.springframework.security=INFO