services:
  postgres:
    env_file:
      - ../../.env
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/001_init_databases.sh:ro
      - ../../backend/auth-service/src/main/resources/db/migration/V1__auth_schema.sql:/docker-entrypoint-initdb.d/migrations/auth_db.sql:ro
      - ../../backend/user-service/src/main/resources/db/migration/V1__user_schema.sql:/docker-entrypoint-initdb.d/migrations/user_db.sql:ro
      - ../../backend/project-service/src/main/resources/db/migration/V1__project_schema.sql:/docker-entrypoint-initdb.d/migrations/project_db.sql:ro
      - ../../backend/forum-service/src/main/resources/db/migration/V1__forum_schema.sql:/docker-entrypoint-initdb.d/migrations/forum_db.sql:ro
      - ../../backend/halloffame-service/src/main/resources/db/migration/V1__halloffame_schema.sql:/docker-entrypoint-initdb.d/migrations/halloffame_db.sql:ro
      - ../../backend/ai-service/src/main/resources/db/migration/V1__ai_schema.sql:/docker-entrypoint-initdb.d/migrations/ai_db.sql:ro
      - ../../backend/payment-service/src/main/resources/db/migration/V1__payment_schema.sql:/docker-entrypoint-initdb.d/migrations/payment_db.sql:ro
      - ../../backend/admin-service/src/main/resources/db/migration/V1__admin_schema.sql:/docker-entrypoint-initdb.d/migrations/admin_db.sql:ro
      - ../../backend/chat-service/src/main/resources/db/migration/V1__chat_schema.sql:/docker-entrypoint-initdb.d/migrations/chat_db.sql:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    env_file:
      - ../../.env
    image: redis:7
    ports:
      - "6379:6379"
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  auth-service:
    env_file:
      - ../../.env
    build:
      context: ../../backend
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0
    environment:
      SERVER_PORT: "8081"
      AUTH_DB_NAME: auth_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false

  user-service:
    env_file:
      - ../../.env
    build:
      context: ../../backend
      dockerfile: user-service/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0
    environment:
      USER_SERVER_PORT: "8084"
      USER_DB_NAME: user_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false

  project-service:
    env_file:
      - ../../.env
    environment:
      PROJECT_SERVER_PORT: "8082"
      PROJECT_DB_NAME: project_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false
    build:
      context: ../../backend
      dockerfile: project-service/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0

  halloffame-service:
    env_file:
      - ../../.env
    environment:
      HALL_OF_FAME_SERVER_PORT: "8085"
      HALLOFFAME_DB_NAME: halloffame_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false
    build:
      context: ../../backend
      dockerfile: halloffame-service/Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0

  forum-service:
    env_file:
      - ../../.env
    environment:
      FORUM_SERVER_PORT: "8083"
      FORUM_DB_NAME: forum_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false
    build:
      context: ../../backend
      dockerfile: forum-service/Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0

  ai-service:
    env_file:
      - ../../.env
    environment:
      AI_SERVER_PORT: "8086"
      AI_DB_NAME: ai_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false
    build:
      context: ../../backend
      dockerfile: ai-service/Dockerfile
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0

  payment-service:
    env_file:
      - ../../.env
    environment:
      PAYMENT_SERVER_PORT: "8087"
      PAYMENT_DB_NAME: payment_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.jmx.enabled=false
        -Dspring.main.lazy-initialization=false
    build:
      context: ../../backend
      dockerfile: payment-service/Dockerfile
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0

  admin-service:
    env_file:
      - ../../.env
    environment:
      ADMIN_SERVER_PORT: "8088"
      ADMIN_DB_NAME: admin_db
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false
    build:
      context: ../../backend
      dockerfile: admin-service/Dockerfile
    ports:
      - "8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0

  chat-service:
    env_file:
      - ../../.env
    build:
      context: ../../backend
      dockerfile: chat-service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      CHAT_DB_NAME: chat_db
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

volumes:
  postgres_data:
