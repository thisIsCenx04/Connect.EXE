services:
  postgres:
    env_file:
      - ../../.env
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend/auth-service/src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    env_file:
      - ../../.env
    image: redis:7
    ports:
      - "6379:6379"
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  auth-service:
    env_file:
      - ../../.env
    build:
      context: ../../backend
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false

  project-service:
    env_file:
      - ../../.env
    environment:
      SERVER_PORT: "8082"
      JAVA_TOOL_OPTIONS: >-
        -Xms128m -Xmx512m
        -XX:MaxMetaspaceSize=192m
        -XX:+UseG1GC
        -XX:+UseStringDeduplication
        -Dspring.main.lazy-initialization=true
        -Dspring.jmx.enabled=false
    build:
      context: ../../backend
      dockerfile: project-service/Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 750m
    cpus: 1.0

volumes:
  postgres_data:
